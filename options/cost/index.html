const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(u,p){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(IV)},key,d64(DATA));return new TextDecoder().decode(pt)}
function show(html){document.open();document.write(html);document.close()}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("b"),er=document.getElementById("e");b.disabled=true;b.textContent="פותח…";er.textContent="";
 try{const u=document.getElementById("u").value,p=document.getElementById("p").value;const h=await open_(u,p);try{sessionStorage.setItem("it27",JSON.stringify([u,p]))}catch(x){}show(h)}
 catch(x){er.textContent="שם המשתמש או הסיסמה לא נכונים";b.disabled=false;b.textContent="כניסה"}});
(async()=>{try{const s=JSON.parse(sessionStorage.getItem("it27")||"null");if(s){show(await open_(s[0],s[1]))}}catch(x){}})();
})();
